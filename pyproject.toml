[project]
name = "slackcc"
version = "0.1.0"
description = "Slack <-> Claude Code bridge (Socket Mode daemon). Part 1: autonomous back-and-forth messaging."
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18",
    "slack-sdk>=3.27",
    "claude-agent-sdk>=0.2.110",
    "websockets>=13.0",  # T3 orchestration v2 commands are WebSocket RPC
    # The shared secret scanner (outbound scrubbing). Pinned to a release tag of
    # pps and installed as a copy into the venv -- NOT an editable link to
    # ~/projects/pps, whose checkout agents switch branches in while this
    # service is running. Bump the tag to pick up new patterns (README, "Secret scrubbing").
    "pps @ git+https://github.com/DanielGGordon/Prompt-Protection-Service.git@secrets-v0.1.0",
]

[project.scripts]
slackcc = "slackcc.__main__:main"
slack-send = "slackcc.send_cli:main"
slack-wait-reply = "slackcc.wait_cli:main"
slack-upload = "slackcc.upload_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["slackcc"]

# The bridge protocol ships with the package: `slackcc init-project` writes it
# into a project's CLAUDE.md, and the daemon renders it into the claude
# backend's system prompt.
[tool.setuptools.package-data]
slackcc = ["data/*.md"]

[tool.pytest.ini_options]
# `pytest tests/` runs the hermetic offline suite only. The live tier
# (real pps + local guard LLM, real inference) is opt-in:
#   .venv/bin/python -m pytest tests/ -m live
markers = [
    "live: hits the running pps service and local guard LLM (real inference, ~30s)",
]
addopts = "-m 'not live'"
